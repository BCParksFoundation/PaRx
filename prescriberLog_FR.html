            <strong>Je désire prescris une carte d'entrée Découverte de Parcs Canada.<br></strong>Les prescripteurs  peuvent prescrire une carte d'entrée Découverte Parcs Canada adulte par mois, jusqu'à épuisement, à vos patients qui en bénéficieraient le plus. Nous vous demandons d'accorder la priorité aux patients qui vivent à proximité de parcs nationaux, de lieux historiques nationaux ou d'aires marines nationales de conservation, et pour qui le coût pourrait constituer un obstacle à l'accès. Plus de détails sur les prescriptions de carte d’entrée Découverte <a href="/fonctionnement" target="_blank"><strong>ici</strong></a>.</span>
